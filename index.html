<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0x8338 — org root</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,12..72,300..600;1,12..72,400&family=Space+Mono&display=swap');

  :root {
    --paper: #faf8f5;
    --ink: #1a1a18;
    --stone: #94908a;
    --stone-light: #d4d0c8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1a18;
      --ink: #e8e4dd;
      --stone: #7a7670;
      --stone-light: #3a3834;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    text-align: center;
    max-width: 34rem;
  }

  h1 {
    margin-top: 1.4rem;
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  h1 .hanzi {
    font-weight: 300;
    color: var(--stone);
  }

  .born {
    margin-top: 1.2rem;
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: var(--stone);
  }

  .born .date {
    font-family: 'Space Mono', 'Courier New', monospace;
    color: var(--ink);
  }

  nav.project {
    margin-top: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
  }

  nav.project a.project-link {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: clamp(0.6rem, 2.4vw, 0.9rem);
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--stone-light);
    border-radius: 12px;
    padding: 0.8rem 2rem;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }

  nav.project a.project-link:hover {
    border-color: var(--ink);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
  }

  nav.project .project-intro {
    font-style: italic;
    font-size: clamp(1rem, 2.8vw, 1.2rem);
    line-height: 1.5;
    color: var(--stone);
    max-width: 24rem;
  }

  nav.project a.meta {
    margin-top: 0.6rem;
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--stone);
    text-decoration: none;
    border-bottom: 1px solid var(--stone-light);
    padding-bottom: 0.2rem;
    transition: color 0.2s;
  }

  nav.project a.meta:hover {
    color: var(--ink);
    border-color: var(--ink);
  }
</style>
</head>
<body>
<main>
  <h1>0x8338 <span class="hanzi">茸</span></h1>
  <p class="born">born at <span class="date">20260624</span></p>
  <nav class="project">
    <a href="/dontforget/" class="project-link">dontforget</a>
    <p class="project-intro">A belief that some things shouldn't be forgotten.</p>
    <a href="https://github.com/0x8338" class="meta">GitHub</a>
  </nav>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0x8338 — org root</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,12..72,300..600;1,12..72,400&family=Space+Mono&display=swap');

  :root {
    --paper: #faf8f5;
    --ink: #1a1a18;
    --stone: #94908a;
    --stone-light: #d4d0c8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1a18;
      --ink: #e8e4dd;
      --stone: #7a7670;
      --stone-light: #3a3834;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    text-align: center;
    max-width: 34rem;
  }

  .eyebrow {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--stone);
  }

  h1 {
    margin-top: 1.4rem;
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  h1 .hanzi {
    font-weight: 300;
    color: var(--stone);
  }

  .born {
    margin-top: 1.2rem;
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: var(--stone);
  }

  .born .date {
    font-family: 'Space Mono', 'Courier New', monospace;
    color: var(--ink);
  }

  nav {
    margin-top: 3rem;
    display: flex;
    justify-content: center;
    gap: 1.25rem;
    flex-wrap: wrap;
  }

  nav a {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--stone-light);
    padding-bottom: 0.25rem;
  }

  nav a:hover { border-color: var(--ink); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">U+8338 · CJK UNIFIED IDEOGRAPH</p>
  <h1>0x8338 <span class="hanzi">茸</span></h1>
  <p class="born">born at <span class="date">20260624</span></p>
  <nav>
    <a href="/dontforget/">dontforget</a>
    <a href="https://github.com/0x8338">GitHub</a>
  </nav>
